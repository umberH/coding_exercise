[project]
name = "careroute"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.11,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<8",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "SIM", "RET", "UP", "C901", "PLR0913", "PLR0915", "ARG"]

[tool.ruff.lint.mccabe]
max-complexity = 5

[tool.ruff.lint.pylint]
max-args = 3

[tool.mypy]
strict = true
python_version = "3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
